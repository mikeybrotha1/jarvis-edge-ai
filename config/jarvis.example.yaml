# Jarvis Edge AI — example application configuration
#
# Copy to config/jarvis.yaml and adjust as needed:
#   cp config/jarvis.example.yaml config/jarvis.yaml
#
# Precedence (highest wins):
#   1. Environment variables (JARVIS_*)
#   2. This YAML file
#   3. Built-in defaults
#
# Secrets: prefer JARVIS_DATABASE_URL over putting credentials in YAML.
# See docs/configuration.md for the full environment variable list.

database:
  # Required unless JARVIS_DATABASE_URL is set.
  url: postgresql://jarvis_app:replace_me@127.0.0.1:5432/jarvis_vision

camera:
  device: 0
  width: 1280
  height: 720
  fps: 30
  source_name: azure_kinect

detector:
  model_path: /usr/local/hailo/resources/models/hailo10h/yolov6n.hef
  confidence_threshold: 0.40
  timeout_seconds: 10.0

memory:
  source: vision_memory
  iou_threshold: 0.30
  max_missed_frames: 8

# Persistent entity memory (v0.4.0)
entity_memory:
  # Identity key strategy. Currently only "tracker_id"
  # (camera_id + track_id scoped keys).
  identity_strategy: tracker_id
  # Minimum seconds between intermediate update snapshots (0 = no throttle).
  snapshot_min_interval_seconds: 0.0
  # When false, skip intermediate update snapshots (create/close still written).
  snapshot_on_update: true

# Read-only entity query API (v0.4.1)
api:
  enabled: false
  host: 0.0.0.0
  port: 8080
  default_limit: 50
  maximum_limit: 200

# Activity timeline query (v0.4.2)
timeline:
  default_limit: 50
  maximum_limit: 200

# Real-time WebSocket activity stream (v0.5.0)
activity_stream:
  enabled: true
  notify_channel: jarvis_activity
  observation_notifications_enabled: false
  observation_min_interval_seconds: 1.0
  client_queue_size: 100
  heartbeat_interval_seconds: 20.0
  max_connections: 25
  reconnect_initial_seconds: 1.0
  reconnect_max_seconds: 30.0

logging:
  level: INFO
  log_file: logs/jarvis.log

runtime:
  platform: raspberry_pi_5
  application: jarvis-edge-ai

# Spatial intelligence (v0.6.0)
spatial:
  enabled: true
  position_strategy: bottom_center
  enter_confirm_observations: 3
  exit_confirm_observations: 3
  lost_track_timeout_seconds: 15
  maximum_zones_per_camera: 10
  occupancy_stale_seconds: 60
  publish_occupancy_changes: true

# Durable alerts & rule evaluation (v0.8.0)
alerts:
  enabled: true
  consumer_name: jarvis-alert-evaluator
  queue_size: 500
  reconcile_interval_seconds: 2
  reconcile_batch_size: 100
  replay_overlap_seconds: 5
  max_rules: 100
  default_cooldown_seconds: 60
  max_metadata_bytes: 8192
  startup_catchup_limit: 500
  timezone_default: UTC

# Outbound webhook notifications (v0.9.0)
# Signing secrets require JARVIS_NOTIFICATIONS_ENCRYPTION_KEY (Fernet key).
notifications:
  enabled: true
  worker_poll_interval_seconds: 1
  max_attempts: 5
  initial_backoff_seconds: 30
  max_backoff_seconds: 1800
  backoff_multiplier: 2.0
  request_timeout_seconds: 5
  max_concurrent_deliveries: 3
  batch_size: 50
  lock_timeout_seconds: 60
  max_request_bytes: 65536
  max_response_bytes: 8192
  allow_private_targets: false
  retention_days: 30
  worker_id: jarvis-notification-worker

# Operational observability & data lifecycle (v0.10.0)
# Phase 3: typed retention policy only — cleanup is disabled and dry_run=true.
# No deletion worker, manual run API, or destructive cleanup is active yet.
ops:
  retention:
    enabled: false
    dry_run: true
    interval_seconds: 86400
    batch_size: 250
    max_batches_per_run: 4
    # Phase 5: required for POST /api/v1/ops/retention/run (still needs enabled + dry_run=false)
    allow_manual_destructive_run: false
    observations:
      enabled: false
      keep_days: 30
    entities:
      enabled: false
      keep_closed_days: 90
    zone_sessions:
      enabled: false
      keep_closed_days: 90
    alerts:
      enabled: false
      keep_resolved_days: 90
    evaluator_state:
      enabled: false
      keep_inactive_days: 30
    notification_deliveries:
      enabled: false
      keep_terminal_days: 90
  timezone_default: UTC
