# Jarvis Edge AI — example application configuration
#
# Copy to config/jarvis.yaml and adjust as needed:
#   cp config/jarvis.example.yaml config/jarvis.yaml
#
# Precedence (highest wins):
#   1. Environment variables (JARVIS_*)
#   2. This YAML file
#   3. Built-in defaults
#
# Secrets: prefer JARVIS_DATABASE_URL over putting credentials in YAML.
# See docs/configuration.md for the full environment variable list.

database:
  # Required unless JARVIS_DATABASE_URL is set.
  url: postgresql://jarvis_app:replace_me@127.0.0.1:5432/jarvis_vision

camera:
  device: 0
  width: 1280
  height: 720
  fps: 30
  source_name: azure_kinect

detector:
  model_path: /usr/local/hailo/resources/models/hailo10h/yolov6n.hef
  confidence_threshold: 0.40
  timeout_seconds: 10.0

memory:
  source: vision_memory
  iou_threshold: 0.30
  max_missed_frames: 8

# Persistent entity memory (v0.4.0)
entity_memory:
  # Identity key strategy. Currently only "tracker_id"
  # (camera_id + track_id scoped keys).
  identity_strategy: tracker_id
  # Minimum seconds between intermediate update snapshots (0 = no throttle).
  snapshot_min_interval_seconds: 0.0
  # When false, skip intermediate update snapshots (create/close still written).
  snapshot_on_update: true

# Read-only entity query API (v0.4.1)
api:
  enabled: false
  host: 0.0.0.0
  port: 8080
  default_limit: 50
  maximum_limit: 200

# Activity timeline query (v0.4.2)
timeline:
  default_limit: 50
  maximum_limit: 200

# Real-time WebSocket activity stream (v0.5.0)
activity_stream:
  enabled: true
  notify_channel: jarvis_activity
  observation_notifications_enabled: false
  observation_min_interval_seconds: 1.0
  client_queue_size: 100
  heartbeat_interval_seconds: 20.0
  max_connections: 25
  reconnect_initial_seconds: 1.0
  reconnect_max_seconds: 30.0

logging:
  level: INFO
  log_file: logs/jarvis.log

runtime:
  platform: raspberry_pi_5
  application: jarvis-edge-ai
